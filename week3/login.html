<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
</head>
<script src="login.js"></script>
<body style="text-align:center">
      <div class="main">
            <h1>Login Form</h1>
            <h3>Enter Your Login Credentials</h3>
            <form>
                  <label for="first">Email</label>
                  <input type="text" name="first" id="email" placeholder="Enter Your Username" required>
                  <br><br>
                  <label for="password">Password</label>
                  <input type="text" name="password" id="pwd" placeholder="Enter Your Password" required>
                  <br><br>
                  <button type="submit" onclick="return LoginValidate()">Login</button>
                  <br><br>
            </form>
      </div>
      <p>Not Registered?
            <a href="register.html" style="text-decoration: none;">
                  Create an Account
            </a>
      </p>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Registration</title>
      <style>
            body{
                  text-align: center;
                  font-family: sans-serif;
            }
            h1{
                  font-size: 20px;
            }
            table tr td{
                  padding-top: 6px;
                  padding-bottom: 6px;
            }
            fieldset{
                  width: 600px;
                  text-align: center;
                  margin: auto;
            }
      </style>
      <div id="header">
            <h1>Registration</h1>
      </div>
</head>
<script defer src="register.js"></script>
<body>
      <center>
            <form name="frm" method="post" action="login.html" onsubmit="return validate()">
                  <fieldset align="center">
                        <table align="center">
                              <tr><td>First Name:</td><td><input type="text" name="fname" value="" size="50" required></td></tr>
                              <tr><td>Last Name:</td><td><input type="text" name="lname" value="" size="50" required></td></tr>
                              <tr><td>Mobile Number:</td><td><input type="text" name="phone" value="" size="50" required></td></tr>
                              <tr><td>Email Id:</td><td><input type="email" name="emailid" value="" size="50" required></td></tr>
                              <tr>
                                    <td>Gender:</td>
                                    <td>Male<input type="radio" name="gender" value="male"></td>
                                    <td>Female<input type="radio" name="gender" value="female"></td>
                              </tr>
                              <tr><td>DOB:</td><td><input type="date" name="dob" size="50" required></td></tr>
                              <tr><td>Username:</td><td><input type="text" name="uname" value="" size="50"></td></tr>
                              <tr><td>Password:</td><td><input type="password" name="pwd" value="" size="50"></td></tr>
                              <tr><td>Age:</td><td><input type="text" name="age" value="" size="50" required></td></tr>
                        </table>
                        <input type="submit" value="SUBMIT" name="submit"/>
                  </fieldset>
            </form>
      </center>
</body>
<div id="footer">
     <h1> Copyright@CMRIT_2025 </h1>
</div>
</html>
